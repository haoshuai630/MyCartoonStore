<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('全部商品')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap">
            <div class="section-head">
                <div><span class="en">ALL PRODUCTS</span><h2>全部商品</h2></div>
            </div>

            <!-- 筛选条：作品下拉 + 类型 + 排序，一个表单提交，作品再多也不会撑爆页面 -->
            <form class="filter-bar" th:action="@{/category}" method="get">
                <label class="field">
                    <span>作品</span>
                    <select name="workId">
                        <option value="">全部作品</option>
                        <option th:each="w : ${works}" th:value="${w.id}"
                                th:text="${w.name}"
                                th:selected="${query.workId == w.id.toString()}">作品</option>
                    </select>
                </label>

                <input type="hidden" name="productType" th:value="${query.productType}">
                <input type="hidden" name="sort" th:value="${query.sort}">
                <label class="field">
                    <span>关键字</span>
                    <input name="keyword" th:value="${query.keyword}" placeholder="商品名称">
                </label>
                <button class="btn btn-primary" type="submit">筛选</button>
                <a class="btn btn-ghost" th:href="@{/category}">重置</a>
            </form>

            <div class="toolbar">
                <div class="types">
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, sort=${query.sort}, productType='ALL')}"
                       th:classappend="${query.productType == 'ALL'} ? 'on'">全部</a>
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, sort=${query.sort}, productType='COMIC')}"
                       th:classappend="${query.productType == 'COMIC'} ? 'on'">单行本</a>
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, sort=${query.sort}, productType='MERCH')}"
                       th:classappend="${query.productType == 'MERCH'} ? 'on'">周边</a>
                </div>
                <div class="sorts">
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort='DEFAULT')}"
                       th:classappend="${query.sort == 'DEFAULT'} ? 'on'">默认</a>
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort='PRICE_ASC')}"
                       th:classappend="${query.sort == 'PRICE_ASC'} ? 'on'">价格低到高</a>
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort='PRICE_DESC')}"
                       th:classappend="${query.sort == 'PRICE_DESC'} ? 'on'">价格高到低</a>
                    <a th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort='NEWEST')}"
                       th:classappend="${query.sort == 'NEWEST'} ? 'on'">最新</a>
                </div>
            </div>

            <p class="result-meta">
                共 <b th:text="${page.total}">0</b> 件
                <span th:if="${query.keyword != null and !query.keyword.isEmpty()}">，关键字「<b th:text="${query.keyword}">词</b>」</span>
            </p>

            <div class="grid" th:if="${!page.isEmpty()}">
                <article class="card" th:each="p : ${page.items}">
                    <a class="media" th:href="@{/product/{id}(id=${p.id})}">
                        <img th:src="@{${p.coverImage}}" th:alt="${p.name}">
                    </a>
                    <div class="body">
                        <span class="cat" th:text="${p.sku}">SKU</span>
                        <h3><a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}">商品</a></h3>
                        <div class="foot">
                            <span class="price" th:text="'¥' + ${#numbers.formatDecimal(p.price, 1, 2)}">¥0.00</span>
                            <span class="stock" th:classappend="${p.stock == 0} ? 'zero'"
                                  th:text="${p.stock == 0} ? '暂时缺货' : '库存 ' + ${p.stock}">库存</span>
                        </div>
                    </div>
                </article>
            </div>

            <p class="empty" th:if="${page.isEmpty()}">没有符合条件的商品，换个条件试试。</p>

            <nav class="pager" th:if="${page.totalPages() > 1}">
                <a th:if="${page.hasPrevious()}"
                   th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort=${query.sort}, page=${page.page - 1})}">上一页</a>
                <span th:unless="${page.hasPrevious()}" class="disabled">上一页</span>
                <span th:text="'第 ' + ${page.page} + ' / ' + ${page.totalPages()} + ' 页'">第 1 / 1 页</span>
                <a th:if="${page.hasNext()}"
                   th:href="@{/category(workId=${query.workId}, keyword=${query.keyword}, productType=${query.productType}, sort=${query.sort}, page=${page.page + 1})}">下一页</a>
                <span th:unless="${page.hasNext()}" class="disabled">下一页</span>
            </nav>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
