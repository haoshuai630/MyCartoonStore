<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的订单')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap">
            <div class="section-head">
                <div>
                    <span class="en">MY ORDERS</span>
                    <h2>我的订单</h2>
                </div>
                <a th:href="@{/products}">继续逛逛</a>
            </div>

            <!-- 状态页签：角标数量来自真实查询；当前页签高亮 -->
            <nav class="order-tabs">
                <a th:each="tab : ${tabs}"
                   th:href="@{/orders(status=${tab.code}, orderNo=${pageData.orderNo})}"
                   th:classappend="${pageData.status == tab.code} ? 'on'"
                   th:text="|${tab.label} ${tab.count}|">全部 0</a>
            </nav>

            <!-- 搜索：完整订单号精确匹配，与状态页签共同生效 -->
            <form class="order-search" th:action="@{/orders}" method="get">
                <input type="hidden" name="status" th:value="${pageData.status}">
                <input type="text" name="orderNo" maxlength="40"
                       th:value="${pageData.orderNo}" placeholder="输入完整订单号">
                <button type="submit" class="btn btn-primary">搜索</button>
                <a th:href="@{/orders(status=${pageData.status})}" class="link-btn">清空</a>
            </form>

            <!-- 空状态：按是否有筛选条件给不同文案 -->
            <div class="order-empty" th:if="${pageData.cards.isEmpty()}">
                <p th:if="${pageData.orderNo != null}"
                   th:text="|没有订单号是「${pageData.orderNo}」的订单。|">没有匹配的订单。</p>
                <p th:if="${pageData.orderNo == null and pageData.status == 'ALL'}">还没有订单，去挑一本喜欢的漫画吧。</p>
                <p th:if="${pageData.orderNo == null and pageData.status != 'ALL'}"
                   th:text="|没有「${currentLabel}」状态的订单。|">该状态下没有订单。</p>
                <a class="btn btn-primary" th:href="@{/products}">去逛逛</a>
            </div>

            <!-- 订单卡片：订单号、时间、状态、首件缩略图、件数、总额、查看 -->
            <div class="order-list" th:if="${not pageData.cards.isEmpty()}">
                <article class="order-card" th:each="card : ${pageData.cards}">
                    <div class="order-card-top">
                        <b class="no" th:text="${card.orderNo}">CO00000000000000</b>
                        <span class="time"
                              th:text="${#temporals.format(card.createdAt, 'yyyy-MM-dd HH:mm')}">时间</span>
                        <span class="order-badge" th:classappend="| s-${card.status}|"
                              th:text="${card.statusLabel}">待支付</span>
                    </div>
                    <div class="order-card-body">
                        <img th:src="@{${card.firstCover}}" th:alt="${card.firstProductName}">
                        <div class="order-card-text">
                            <b th:text="${card.firstProductName}">首件商品</b>
                            <small th:text="|共 ${card.totalQuantity} 件 · ${card.itemCount} 种商品|">共 1 件</small>
                        </div>
                        <div class="order-card-amount"
                             th:text="'¥' + ${#numbers.formatDecimal(card.totalAmount, 1, 2)}">¥0.00</div>
                        <!-- 卡片操作：待支付的两种动作，其余仅查看 -->
                        <div class="order-card-actions">
                            <a class="btn btn-ghost" th:if="${card.status == 'PENDING_PAYMENT'}"
                               th:href="@{/payment/{no}(no=${card.orderNo})}">去支付</a>
                            <form th:if="${card.status == 'PENDING_PAYMENT'}"
                                  th:action="@{/orders/{no}/cancel(no=${card.orderNo})}" method="post"
                                  onsubmit="return confirm('取消后将关闭订单并释放库存，确定取消吗？')">
                                <button type="submit" class="btn btn-ghost">取消</button>
                            </form>
                            <a class="btn btn-ghost" th:href="@{/orders/{no}(no=${card.orderNo})}">查看</a>
                        </div>
                    </div>
                </article>
            </div>

            <!-- 分页：保留状态与单号 -->
            <nav class="pager" th:if="${pageData.totalPages > 1}">
                <a th:if="${pageData.hasPrev}"
                   th:href="@{/orders(status=${pageData.status}, orderNo=${pageData.orderNo}, page=${pageData.page - 1})}">上一页</a>
                <span th:text="|第 ${pageData.page} / ${pageData.totalPages} 页 · 共 ${pageData.total} 单|">第 1 页</span>
                <a th:if="${pageData.hasNext}"
                   th:href="@{/orders(status=${pageData.status}, orderNo=${pageData.orderNo}, page=${pageData.page + 1})}">下一页</a>
            </nav>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
