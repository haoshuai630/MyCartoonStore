<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('登录')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap auth-box">
            <h1>登录</h1>

            <!-- 注册成功等一次性提示 -->
            <p class="auth-ok" th:if="${message}" th:text="${message}">提示</p>
            <p class="auth-error" th:if="${error}" th:text="${error}">错误提示</p>

            <form th:action="@{/login}" method="post" class="auth-form">
                <input type="hidden" name="redirect" th:value="${param.redirect}">
                <label>
                    <span>用户名</span>
                    <input name="username" th:value="${username}" required autocomplete="username">
                </label>
                <label>
                    <span>密码</span>
                    <input type="password" name="password" required autocomplete="current-password">
                </label>
                <button class="btn btn-primary" type="submit">登录</button>
            </form>

            <p class="auth-switch">还没有账号？<a th:href="@{/register}">去注册</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
