<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap auth-box">
            <h1>注册</h1>
            <p class="hint">用户名 3–32 位字母、数字或下划线；密码至少 8 位。</p>

            <!-- 校验失败的原因显示在这里，不弹窗 -->
            <p class="auth-error" th:if="${error}" th:text="${error}">错误提示</p>

            <form th:action="@{/register}" method="post" class="auth-form">
                <input th:replace="~{fragments/csrf :: hidden}">
                <label>
                    <span>用户名</span>
                    <input name="username" th:value="${username}" required maxlength="32" autocomplete="username">
                </label>
                <label>
                    <span>显示名（可不填）</span>
                    <input name="displayName" th:value="${displayName}" maxlength="50">
                </label>
                <label>
                    <span>密码</span>
                    <input type="password" name="password" required minlength="8" autocomplete="new-password">
                </label>
                <label>
                    <span>确认密码</span>
                    <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password">
                </label>
                <!-- M10-04：注册同样要验证码，与登录共用 /captcha -->
                <label>
                    <span>验证码</span>
                    <input name="captcha" maxlength="4" required autocomplete="off" placeholder="4 位字符">
                </label>
                <img class="captcha-img" th:src="@{/captcha}" alt="验证码"
                     onclick="this.src='/captcha?t=' + Date.now()" title="看不清？点击换一张">
                <button class="btn btn-primary" type="submit">注册</button>
            </form>

            <p class="auth-switch">已有账号？<a th:href="@{/login}">去登录</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
