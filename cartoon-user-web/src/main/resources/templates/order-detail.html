<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('订单详情')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap">
            <nav class="crumbs">
                <a th:href="@{/main}">首页</a>
                <span>/</span>
                <a th:href="@{/orders}">我的订单</a>
                <span>/</span>
                <b th:text="${order.orderNo}">订单号</b>
            </nav>

            <!-- 取消成功后的一次性提示 -->
            <p class="auth-ok" th:if="${message}" th:text="${message}">订单已取消</p>

            <!-- 头部：状态、订单号、创建时间 -->
            <div class="order-head">
                <div>
                    <span class="en">ORDER</span>
                    <h2 th:text="${order.orderNo}">订单号</h2>
                    <p class="hint">创建时间
                        <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}">时间</span>
                    </p>
                </div>
                <div class="order-status" th:switch="${order.status}">
                    <b th:case="'PENDING_PAYMENT'">待支付</b>
                    <b th:case="'PAID'">待发货</b>
                    <b th:case="'SHIPPED'">已发货</b>
                    <b th:case="'COMPLETED'">已完成</b>
                    <b th:case="'CANCELLED'">已取消</b>
                    <b th:case="*" th:text="${statusLabel}">状态</b>
                </div>
            </div>

            <!-- 时间线：只显示已经发生的节点，未发生的节点不占位 -->
            <ol class="timeline">
                <li class="on">
                    <b>创建订单</b>
                    <span th:text="${#temporals.format(order.createdAt, 'MM-dd HH:mm')}">时间</span>
                </li>
                <li class="on" th:if="${order.paidAt != null}">
                    <b>模拟支付</b>
                    <span th:text="${#temporals.format(order.paidAt, 'MM-dd HH:mm')}">时间</span>
                </li>
                <li class="on" th:if="${order.shippedAt != null}">
                    <b>发货</b>
                    <span th:text="${#temporals.format(order.shippedAt, 'MM-dd HH:mm')}">时间</span>
                </li>
                <li class="on" th:if="${order.completedAt != null}">
                    <b>完成</b>
                    <span th:text="${#temporals.format(order.completedAt, 'MM-dd HH:mm')}">时间</span>
                </li>
                <li class="cancel" th:if="${order.cancelledAt != null}">
                    <b>已取消</b>
                    <span th:text="${#temporals.format(order.cancelledAt, 'MM-dd HH:mm')}">时间</span>
                </li>
            </ol>

            <div class="order-grid">
                <!-- 商品快照：名称、SKU、单价、数量、行金额都不是当前商品值，而是下单时的快照 -->
                <div class="order-items">
                    <h3>商品明细</h3>
                    <div class="order-row" th:each="item : ${items}">
                        <img th:src="@{${item.coverImageSnapshot}}" th:alt="${item.productNameSnapshot}">
                        <div class="order-row-text">
                            <a class="title" th:href="@{/product/{id}(id=${item.productId})}"
                               th:text="${item.productNameSnapshot}">商品名</a>
                            <small th:text="${item.skuSnapshot}">SKU</small>
                        </div>
                        <span th:text="'¥' + ${#numbers.formatDecimal(item.unitPrice, 1, 2)}">¥0.00</span>
                        <span th:text="'× ' + ${item.quantity}">× 1</span>
                        <span class="order-line" th:text="'¥' + ${#numbers.formatDecimal(item.lineAmount, 1, 2)}">¥0.00</span>
                    </div>
                </div>

                <!-- 右侧：收货快照与总额；操作按钮等 M05-05/M06 接入后再出现 -->
                <div class="order-side">
                    <h3>收货信息</h3>
                    <ul class="order-receiver">
                        <li><span>收货人</span><b th:text="${order.receiverName}">姓名</b></li>
                        <li><span>联系电话</span><b th:text="${order.receiverPhone}">电话</b></li>
                        <li><span>详细地址</span><b th:text="${order.receiverAddress}">地址</b></li>
                    </ul>
                    <div class="order-total">
                        <!-- 待支付显示“应付”，已支付（含发货/完成）显示“已模拟支付” -->
                        <span th:text="${order.paidAt != null} ? '已模拟支付' : '应付总额'">应付总额</span>
                        <b th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">¥0.00</b>
                    </div>
                    <p class="hint">模拟支付在 M06 接入；本页展示数据库里的真实快照与状态。</p>

                    <!-- 待支付才能取消；取消后库存恢复，购物车不自动回填 -->
                    <form th:if="${order.status == 'PENDING_PAYMENT'}"
                          th:action="@{/orders/{no}/cancel(no=${order.orderNo})}" method="post" class="order-action">
                        <button type="submit" class="btn btn-danger">取消订单</button>
                    </form>
                    <p class="hint" th:if="${order.status == 'PENDING_PAYMENT'}">取消后库存会恢复，购物车不会自动回填。</p>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
