<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('修改密码')}"></head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<main>
    <section class="section">
        <div class="wrap auth-box">
            <h1>修改密码</h1>
            <!-- 规则一次写清，避免用户提交后才逐条试错 -->
            <p class="hint">新密码 8–32 个字符，至少包含字母、数字、符号中的两类，不能含空白；改完需要重新登录。</p>

            <!-- 校验失败的原因显示在这里，不弹窗，也不回填任何密码 -->
            <p class="auth-error" th:if="${error}" th:text="${error}">错误提示</p>

            <form th:action="@{/password}" method="post" class="auth-form">
                <input th:replace="~{fragments/csrf :: hidden}">
                <label>
                    <span>原密码</span>
                    <input type="password" name="oldPassword" required autocomplete="current-password">
                </label>
                <label>
                    <span>新密码</span>
                    <input type="password" name="newPassword" required minlength="8" maxlength="32"
                           autocomplete="new-password">
                </label>
                <label>
                    <span>再次输入新密码</span>
                    <input type="password" name="confirmPassword" required minlength="8" maxlength="32"
                           autocomplete="new-password">
                </label>
                <button class="btn btn-primary" type="submit">修改密码</button>
            </form>

            <p class="auth-switch"><a th:href="@{/profile}">返回个人资料</a> · <a th:href="@{/main}">返回首页</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>

</body>
</html>
