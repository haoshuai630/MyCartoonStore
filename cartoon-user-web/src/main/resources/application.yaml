server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CARTOON_USER_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: cartoon-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/MyCartoonStore?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地教学库口令；改为远程库时请用环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:123456}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
      maximum-pool-size: 10
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    encoding: UTF-8

logging:
  level:
    org.csu.mycartoonstore: info
