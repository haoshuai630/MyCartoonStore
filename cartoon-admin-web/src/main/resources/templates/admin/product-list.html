<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('商品维护')}"></head>
<body>

<div th:replace="~{admin/fragments :: topbar}"></div>
<header th:replace="~{admin/fragments :: header}"></header>

<main>
    <section class="console">
        <div class="wrap">
            <!-- 标题区：列表含下架商品，新增后默认下架 -->
            <div class="console-head">
                <div>
                    <span class="kicker">PRODUCTS</span>
                    <h1>商品维护</h1>
                    <p class="lead">列表包含下架商品。新增后默认为下架，完善资料后在列表里显式上架；
                        库存不改这里，补货有单独入口。</p>
                </div>
                <div class="head-actions">
                    <a class="btn btn-primary" th:href="@{/products/new}">新增商品</a>
                </div>
            </div>

            <!-- 一次性提示：新增/编辑/上下架/补货成功后 -->
            <p class="alert" th:if="${message}" th:text="${message}">已保存</p>

            <!-- 筛选：分类、名称、状态；提交后整页刷新 -->
            <form class="filter-bar" method="get" th:action="@{/products}">
                <label class="field">
                    <span>分类</span>
                    <select name="categoryId">
                        <option value="">全部分类</option>
                        <option th:each="opt : ${filterOptions}" th:value="${opt.id}"
                                th:text="${opt.label}" th:selected="${opt.id.toString() == categoryId}">分类</option>
                    </select>
                </label>
                <label class="field">
                    <span>商品名称</span>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="按名称包含搜索">
                </label>
                <label class="field">
                    <span>状态</span>
                    <select name="status">
                        <option value="ALL" th:selected="${status == 'ALL'}">全部</option>
                        <option value="ON_SALE" th:selected="${status == 'ON_SALE'}">已上架</option>
                        <option value="DRAFT" th:selected="${status == 'DRAFT'}">已下架</option>
                    </select>
                </label>
                <button type="submit" class="btn">查询</button>
                <a class="link-btn" th:href="@{/products}">重置</a>
            </form>

            <!-- 列表：价格两位小数、库存只读、状态徽章 -->
            <div class="panel" th:if="${!page.empty}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th style="width:60px" class="num">ID</th>
                        <th style="width:150px">SKU</th>
                        <th>名称</th>
                        <th style="width:150px">分类</th>
                        <th style="width:100px" class="num">价格</th>
                        <th style="width:80px" class="num">库存</th>
                        <th style="width:100px">状态</th>
                        <th style="width:80px" class="num">排序</th>
                        <th style="width:200px">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${page.items}">
                        <td class="num" th:text="${row.id}">1</td>
                        <td><code th:text="${row.sku}">SKU</code></td>
                        <td><b th:text="${row.name}">名称</b></td>
                        <td th:text="${row.categoryName}">分类</td>
                        <td class="num" th:text="'¥' + ${#numbers.formatDecimal(row.price, 1, 2)}">¥0.00</td>
                        <td class="num" th:text="${row.stock}">0</td>
                        <td>
                            <span class="status-tag" th:classappend="${row.status == 'ON_SALE'} ? 'on' : 'off'"
                                  th:text="${row.status == 'ON_SALE'} ? '已上架' : '已下架'">状态</span>
                        </td>
                        <td class="num" th:text="${row.sortOrder}">0</td>
                        <td class="row-actions">
                            <a class="link-btn" th:href="@{/products/{id}/edit(id=${row.id})}">编辑</a>
                            <!-- M08-05：进入该商品的相册维护，只维护记录，不改封面 -->
                            <a class="link-btn" th:href="@{/products/{id}/images(id=${row.id})}">相册</a>
                            <!-- 上下架：提交当前版本，版本冲突由服务端给 409 -->
                            <form class="inline-form" th:action="@{/products/{id}/status(id=${row.id})}" method="post">
                                <input th:replace="~{admin/csrf :: hidden}">
                                <input type="hidden" name="version" th:value="${row.version}">
                                <input type="hidden" name="status"
                                       th:value="${row.status == 'ON_SALE'} ? 'DRAFT' : 'ON_SALE'">
                                <button type="submit" class="link-btn"
                                        th:text="${row.status == 'ON_SALE'} ? '下架' : '上架'">上架</button>
                            </form>
                            <!-- 增量补货：只填"加多少"，服务端在最新库存上累加 -->
                            <form class="inline-form" th:action="@{/products/{id}/restock(id=${row.id})}" method="post">
                                <input th:replace="~{admin/csrf :: hidden}">
                                <input type="number" name="quantity" value="10" min="1" max="100000" class="qty-input">
                                <button type="submit" class="link-btn">补货</button>
                            </form>
                            <!-- M10-01：删除是物理删除；有订单引用会被拒（409），提示改用下架 -->
                            <form class="inline-form" th:action="@{/products/{id}/delete(id=${row.id})}" method="post"
                                  onsubmit="return confirm('删除后不可恢复，历史订单引用时会被拒绝。若只是停售请用下架。确定删除吗？')">
                                <input th:replace="~{admin/csrf :: hidden}">
                                <button type="submit" class="link-btn danger">删除</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- 翻页：保留筛选条件 -->
                <div class="pager">
                    <a th:if="${page.hasPrevious}"
                       th:href="@{/products(categoryId=${categoryId}, keyword=${keyword}, status=${status}, page=${page.page - 1})}">上一页</a>
                    <span th:if="${!page.hasPrevious}" class="disabled">上一页</span>
                    <span th:text="|第 ${page.page} / ${page.totalPages} 页，共 ${page.total} 件|">第 1 / 1 页</span>
                    <a th:if="${page.hasNext}"
                       th:href="@{/products(categoryId=${categoryId}, keyword=${keyword}, status=${status}, page=${page.page + 1})}">下一页</a>
                    <span th:if="${!page.hasNext}" class="disabled">下一页</span>
                </div>
            </div>

            <!-- 空状态：区分"还没有商品"与"筛选没结果" -->
            <div class="empty" th:if="${page.empty}">
                <b th:text="${keyword != null and !keyword.isBlank()} ? '没有匹配的商品' : '还没有商品'">还没有商品</b>
                <p th:text="${keyword != null and !keyword.isBlank()} ? '换个关键字或清空筛选再试。' : '新增第一件商品后，记得上架才会出现在用户端。'">说明</p>
                <a class="btn" th:href="@{/products}">清空筛选</a>
                <a class="btn btn-primary" th:href="@{/products/new}">新增商品</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{admin/fragments :: footer}"></footer>

</body>
</html>
