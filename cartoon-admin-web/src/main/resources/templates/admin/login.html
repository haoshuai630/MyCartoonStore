<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('管理员登录')}"></head>
<body class="login-body">

<!-- 管理端登录：与用户端同构，但文案明确"管理员入口" -->
<main class="login-wrap">
    <div class="login-card">
        <span class="kicker">MANGA ISLE / ADMIN</span>
        <h1>管理员登录</h1>
        <p class="lead">这里是店铺管理后台，只接受管理员账号。顾客请到用户端登录。</p>

        <!-- 登录失败时的一次性提示：文案统一为"账号或密码错误，或账号不可用" -->
        <p class="form-error" th:if="${error}" th:text="${error}">账号或密码错误，或账号不可用</p>

        <form th:action="@{/login}" method="post" class="login-form">
            <label>
                <span>管理员账号</span>
                <!-- 失败时回显用户名，但密码永远不回显 -->
                <input type="text" name="username" th:value="${username}" required autofocus autocomplete="username">
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary">登录后台</button>
        </form>

        <p class="hint">教学账号：<b>admin</b> / <b>Cartoon123!</b></p>
        <p class="hint">顾客不能从这里登录；管理员也不能在用户端下单。</p>
    </div>
</main>

<footer th:replace="~{admin/fragments :: footer}"></footer>

</body>
</html>
