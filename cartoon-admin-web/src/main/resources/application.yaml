server:
  port: 8081
  servlet:
    context-path: /admin
    session:
      timeout: 30m
      # 只允许 Cookie 跟踪会话：容器不再把会话 ID 拼进 URL（;CARTOON_ADMIN_SESSION=…），
      # 否则首次登录的 302 会跳到 /admin/;<id>，被当成静态资源路径而 404。
      tracking-modes: cookie
      cookie:
        name: CARTOON_ADMIN_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: cartoon-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/MyCartoonStore?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地教学库口令；改为远程库时请用环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:123456}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
      maximum-pool-size: 10
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    encoding: UTF-8

mybatis-plus:
  # 自定义 SQL 分散在各业务模块的 resources/mapper 下，用 classpath* 才能从 JAR 里找到
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.csu.mycartoonstore: info
