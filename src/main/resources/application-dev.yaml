# 本地开发环境配置（profile: dev）
spring:
  application:
    name: MyPetStore-SSM

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/MyPetStore?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地教学库口令（仅本机 localhost 使用）；如改为远程库，请改用环境变量 DB_PASSWORD
    password: 123456
    hikari:
      # 连接池初始化每个新连接时执行，使会话时区与连接时区一致
      connection-init-sql: "SET time_zone = '+08:00'"

  # 启动时不执行 schema.sql / data.sql，不自动建表或导入数据
  sql:
    init:
      mode: never
